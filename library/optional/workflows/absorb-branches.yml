# ⚠ **OPT-IN. THIS FILE DOES NOTHING WHERE IT SITS — GitHub only runs a workflow under
# `.github/workflows/`.** To turn it on in a chart:
#
#     mkdir -p .github/workflows
#     cp library/optional/workflows/absorb-branches.yml .github/workflows/
#
# **WHY THE TEMPLATE DOES NOT SHIP IT ENABLED.** It merges every pushed branch into `main` within
# seconds, with no human and no review. On a personal chart that is exactly right — see below. On
# the TEMPLATE it is wrong twice over: a template is a repository people fork and send pull
# requests to, so auto-merging every branch destroys the review step a PR exists to provide; and a
# contributor's work-in-progress branch would land on `main` the moment they pushed it. Enabled in
# the template, it also silently absorbed the branches of the very work that removed it.
#
# **DECIDE BEFORE COPYING IT IN, because the trade is real.** Turn it on where the repository is
# one athlete's chart, has no PR workflow, and a branch is therefore a bug report rather than a
# feature. Leave it off where anyone else pushes branches on purpose. It is not needed for
# correctness either way: the dashboard's stray-branch banner surfaces unmerged data whether or not
# this runs, and `CLAUDE.md` §0.1 makes a coaching session find and merge stray branches at session
# start. This turns that cleanup from "whenever a session happens to run" into "within seconds".
#
# Merges any branch that isn't `main` back into `main`, immediately and automatically.
#
# WHY IT EXISTS AT ALL. This repo has no PR workflow. A branch is not a feature here — it is a bug
# report. Some surfaces the athlete coaches from create their own branch instead of committing to
# `main`, and when they do, the data is *in git and invisible*: `main` never gets it, the build
# never sees it, and the dashboard shows a blank panel for a meal that was logged hours ago.
#
# It has happened: a meal logged to an auto-created branch mid-morning, still missing from the
# dashboard two hours later. CLAUDE.md §0.1 already required a coaching session to find and merge
# stray branches at session start — but that is a manual cleanup that only runs when a session
# happens to run, and in the meantime the athlete is reading a dashboard that is quietly wrong.
#
# So: absorb them on push, within seconds, with no human and no agent involved.
name: Absorb stray branches

on:
  push:
    branches-ignore:
      - main
      - 'keep/**'   # escape hatch: a branch the athlete deliberately wants left alone
  schedule:
    # Backstop only. Catches branches pushed while this workflow was failing, branches that predate
    # it, and anything created by a path that doesn't fire a push event.
    #
    # ⚠ THIS DOES NOT RUN HOURLY, AND NOTHING HERE CAN MAKE IT. GitHub queues scheduled workflows
    # on shared capacity and drops slots under load: observed runs never land at :17, drift up to
    # ~50 min, and the 00:17, 01:17, 03:17, 04:17 and 20:17 slots were skipped outright (audit
    # F-40). Read this as "roughly once an hour, sometimes not for four", because that is what it
    # is. A cron expression is a request, not a guarantee.
    #
    # Deliberately left at one nominal run per hour rather than moved to */20. The extra runs would
    # buy nothing real: the primary path is the `push` trigger above, which fires within seconds;
    # a branch that loses the delete race is re-triggered by the very push that beat it; and the
    # actual guarantee that stray data gets noticed is the dashboard's stray-branch banner, which
    # is on the surface the athlete looks at and does not depend on this schedule at all.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Never run two absorbs at once — they would race each other pushing main.
  group: absorb-branches
  cancel-in-progress: false

jobs:
  absorb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The body of this job is scripts/absorb-branches.mjs, NOT this file.
      #
      # It lived here, inline, for a long time — and that is precisely why a race that silently
      # destroyed the athlete's logged data survived in it: logic inside a `run:` block cannot be
      # tested. `scripts/test-git-sync.mjs` now replays the real race against real repositories,
      # which is only possible because the code is somewhere a test can call it.
      #
      # What the script does, per branch and independently (audit F-04, F-18, F-36):
      #   merge a CAPTURED SHA -> run the full check suite -> push main, re-applying from scratch
      #   on a lost race -> delete the branch only under a lease on that same SHA.
      # A branch that was pushed to mid-run is never deleted; it is left standing and absorbed by
      # the run that push triggers.
      - name: Absorb every branch that is not main
        run: |
          git config user.name "absorb-bot"
          git config user.email "brandallux@gmail.com"
          node scripts/absorb-branches.mjs
