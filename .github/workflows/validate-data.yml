name: Validate data

# data/ is the source of truth for every number in the chart. A malformed row must fail loudly
# here rather than render as a confident wrong number on the dashboard.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The suite lives in scripts/check-all.mjs, not in this file, because the bot workflows must
      # run exactly the same checks before they push — GitHub does not trigger workflows from
      # GITHUB_TOKEN pushes, so absorb-bot, steps-bot and rollover-bot never reach this job. Four
      # copies of a step list is the two-homes defect (INVARIANTS.md X-8), and it had already
      # drifted into three different answers about what "checked" means.
      - name: Run the data-layer check suite
        run: node scripts/check-all.mjs

  # DELIBERATELY NOT IN check-all.mjs, and therefore not in the bot workflows.
  #
  # check-all runs inline in log-steps, daily-rollover and absorb before every push, so anything in
  # it is a gate on the athlete's data reaching main. This suite builds bare repositories and races
  # real pushes against each other: it is the slowest check here (~8 s), it is the one most exposed
  # to environment differences, and — the deciding argument — it tests the push machinery itself.
  # A flake in it would stop a logged meal from being saved in order to protect a test about saving
  # meals. INVARIANTS.md: the software never blocks reality.
  #
  # It belongs in CI, where the audience is the maintainer and the only thing it can hold up is a
  # deploy. It runs on every push to main and every dispatch, which is where a regression in the
  # git plumbing would be introduced.
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The scripts commit inside their fixtures; a runner has no default git identity.
      - name: Give the runner a git identity
        run: |
          git config --global user.name "ci-fixture"
          git config --global user.email "ci-fixture@example.invalid"

      - name: Replay the branch-absorption races against real repositories
        timeout-minutes: 5
        run: node scripts/test-git-sync.mjs

  # DELIBERATELY NOT IN check-all.mjs either, and for the same reason as git-sync above: this suite
  # clones the repository twice and runs the whole check suite inside each copy. It is fast (~2.5 s)
  # and deterministic, but it is exposed to the environment rather than to the data, and check-all
  # gates the athlete's own writes.
  #
  # What it asserts is W7's acceptance criterion, executed rather than described: a repo with NO
  # chart passes clean with its chart-dependent steps skipped by name (so a multi-session intake is
  # never red — audit F-39), and a chart written for an athlete this repo has never met — different
  # sex, timezone, domains and session types — passes clean with no rows in it (F-30, F-17).
  cold-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The suite commits inside its fixture repositories; a runner has no default git identity.
      - name: Give the runner a git identity
        run: |
          git config --global user.name "ci-fixture"
          git config --global user.email "ci-fixture@example.invalid"

      - name: Fork the template, run intake, and check the result
        timeout-minutes: 5
        run: node scripts/test-cold-start.mjs

  # Runs the same clean install Vercel runs. A package.json range that doesn't resolve, or a
  # lockfile out of step with it, fails here on push rather than on the deploy.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ⚠ **A CHART-LESS REPO MUST GO GREEN HERE, for exactly the reason check-all.mjs does.**
      # `npm run build` is REFUSED before intake, on purpose — scripts/check-chart-for-build.mjs,
      # because a dashboard rendering an athlete who does not exist is worse than no dashboard.
      # But this job ran it unconditionally, so the template repo and every chart's whole intake
      # week carried a red X on GitHub. That is audit F-39 one layer up: the guard's own message
      # says "`npm run validate` and `npm run check` are both green on this repo right now" while
      # the commit beside it shows a failure. A red build that is the expected outcome teaches a
      # new athlete that red is normal, which is how the one that matters gets ignored.
      - name: Is there a chart yet?
        id: chart
        run: |
          if [ -f athlete/constants.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no athlete/constants.json — the dashboard build and route smoke test are"
            echo "SKIPPED, not failed. They render an athlete; there is not one yet."
            echo "The typecheck below still runs, and still has to pass."
          fi

      - name: Clean install from the lockfile
        run: npm ci

      # Runs with or without a chart, and that is the point of it existing separately from the
      # build. `src/generated/data.json` is a gitignored build artifact, so before this repo has
      # ever been built there is nothing for the JSON import to resolve to — which used to make
      # `tsc` fail with TS2307 and say nothing about the code. `src/generated-data.d.ts` declares
      # that module instead, so the typecheck answers the question it is actually being asked,
      # on any repo, in any state.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        if: steps.chart.outputs.present == 'true'
        run: npm run build

      # A green `next build` proves nothing about any page: every route is force-dynamic, so
      # none of them is rendered at build time. Two variants of one missing guard (a future or
      # blank baseline.date) 500'd the home page on 2026-08-13 with build, validate and data all
      # clean. This step is what makes the build's green light mean the dashboard actually loads.
      # The script starts and owns `next start` itself — deliberately. An earlier version took a
      # URL and requested it, and passed against its own red fixture because a stale server held
      # the port while the build under test died with EADDRINUSE. Owning the lifecycle is what
      # makes a pass mean something.
      # timeout-minutes is a backstop, not a nicety: the first version of this step hung until the
      # run was cancelled by hand, and a hang reads as "still running" rather than "failed" — the
      # exact plausible-not-loud failure X-7 forbids.
      - name: Smoke-test every route
        if: steps.chart.outputs.present == 'true'
        timeout-minutes: 5
        env:
          AUTH_SECRET: ci-smoke-secret
          DASHBOARD_PASSWORD: ci-smoke-password
        run: node scripts/smoke-routes.mjs --port 3100
